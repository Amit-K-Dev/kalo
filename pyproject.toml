[project]
name = "kalo-python-api"
version = "0.2.0"
description = "Kalo FastAPI backend deployed as a Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
